# Particle Desktop Environment - Language Configuration
# This file defines supported languages, locale mappings, and UI text translations
# Format: bash sourced configuration with associative arrays

# ============================================================================
# SUPPORTED LANGUAGES AND ACTIVE LANGUAGE
# ============================================================================

# Active language (will be overridden by user's ~/.config/particlede/language.conf)
ACTIVE_LANGUAGE="zh_CN"

# List of supported languages (can be extended: zh_CN zh_TW en_US ja_JP fr_FR etc.)
declare -a SUPPORTED_LANGUAGES=("zh_CN" "en_US")

# ============================================================================
# LANGUAGE TO LOCALE MAPPING
# ============================================================================
# Maps language codes to standard Linux locale strings

declare -A LOCALE_MAP=(
    [zh_CN]="zh_CN.UTF-8"
    [en_US]="en_US.UTF-8"
)

# Language names for display (in native language)
declare -A LANGUAGE_NAMES=(
    [zh_CN]="简体中文"
    [en_US]="English"
)

# ============================================================================
# UI TEXT TRANSLATIONS - Openbox Menu
# ============================================================================

declare -A UI_TEXT_LAUNCHER=(
    [zh_CN]="启动器"
    [en_US]="Launcher"
)

declare -A UI_TEXT_FILE_MANAGER=(
    [zh_CN]="文件管理器"
    [en_US]="File Manager"
)

declare -A UI_TEXT_TERMINAL=(
    [zh_CN]="终端"
    [en_US]="Terminal"
)

declare -A UI_TEXT_RESTART_OPENBOX=(
    [zh_CN]="重新加载 Openbox"
    [en_US]="Restart Openbox"
)

declare -A UI_TEXT_LOGOUT=(
    [zh_CN]="退出登录"
    [en_US]="Logout"
)

# ============================================================================
# UI TEXT TRANSLATIONS - Rofi Display
# ============================================================================

declare -A UI_TEXT_ROFI_DRUN=(
    [zh_CN]="应用"
    [en_US]="Apps"
)

declare -A UI_TEXT_ROFI_RUN=(
    [zh_CN]="查找"
    [en_US]="Run"
)

declare -A UI_TEXT_ROFI_FILEBROWSER=(
    [zh_CN]="文件"
    [en_US]="File"
)

declare -A UI_TEXT_ROFI_WINDOW=(
    [zh_CN]="窗口"
    [en_US]="Window"
)

# ============================================================================
# INPUT METHOD CONFIGURATION
# ============================================================================
# Specifies which input method should be active for each language

declare -A INPUT_METHOD_FOR_LANGUAGE=(
    [zh_CN]="fcitx5"
    [en_US]="none"
)

# Default input method engine for Chinese
DEFAULT_INPUT_ENGINE="fcitx5"
